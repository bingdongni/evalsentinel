name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run --offline ruff check src tests tools
      - run: uv run --offline ruff format --check src tests tools
      - run: uv run --offline ty check src
      - run: uv run --offline pytest
      - run: uv build

  native-mcp:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Prepare the pinned native source and dependencies
        run: |
          git clone https://github.com/bingdongni/conformance.git .cache/conformance
          git -C .cache/conformance checkout --detach c69c46dbef3083ab4e87b06a6b0e066cc487e214
          npm ci --prefix .cache/conformance --ignore-scripts --no-audit --no-fund
          npm run --prefix .cache/conformance build
          uv sync --locked --no-dev
      - name: Run the two-version native control matrix without model calls
        run: uv run --offline evalsentinel audit mcp --checkout .cache/conformance --output-dir runs/native-ci
