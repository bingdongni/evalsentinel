name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run --offline ruff check src tests tools
      - run: uv run --offline ruff format --check src tests tools
      - run: uv run --offline ty check src
      - run: uv run --offline pytest
      - run: uv build

  native-suite:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Prepare the pinned native source and dependencies
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python tools/prepare_native.py --adapter all
          npm ci --prefix .cache/conformance --ignore-scripts --no-audit --no-fund
          npm run --prefix .cache/conformance build
      - name: Run all 30 independent controls without model calls
        run: uv run --offline --no-dev evalsentinel audit all --mcp-checkout .cache/conformance --owasp-baseline .cache/owasp-harness --owasp-candidate .cache/owasp-fixed --output-dir runs/native-ci
      - name: Verify the matrix and actual strict-mode exit codes
        run: uv run --offline --no-dev python tools/verify_native_suite.py runs/native-ci/report.json
      - name: Verify maintainer-commit gating and real native fault controls
        run: |
          uv build --offline
          uv run --isolated --no-project --python 3.12 --with dist/evalsentinel-0.3.0a1-py3-none-any.whl python -m evalsentinel --version
          uv run --offline --isolated --no-project --python 3.12 --with dist/evalsentinel-0.3.0a1-py3-none-any.whl python tools/verify_maintainer_gate.py --checkout .cache/owasp-fixed --output-dir runs/maintainer-ci

  mcp-production:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Prepare the unchanged upstream runner and the wheel
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python tools/prepare_native.py --adapter mcp-production
          npm ci --prefix .cache/conformance-production --ignore-scripts --no-audit --no-fund
          npm run --prefix .cache/conformance-production build
          uv build
          uv run --isolated --no-project --python 3.12 --with dist/evalsentinel-0.3.0a1-py3-none-any.whl python -m evalsentinel --version
      - name: Verify installed-wheel positive, negative and all-skipped controls offline
        run: uv run --offline --isolated --no-project --python 3.12 --with dist/evalsentinel-0.3.0a1-py3-none-any.whl python tools/verify_mcp_gate.py --require-installed --checkout .cache/conformance-production --output-dir runs/mcp-production-ci
      - name: Retain synthetic native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-production-${{ matrix.os }}
          path: runs/mcp-production-ci
          if-no-files-found: warn
          retention-days: 3
